                const entityNames = Object.values(senhas).sort((a, b) => b.length - a.length);
                const pattern = new RegExp(`\\b(${entityNames.join('|')})\\b`, 'gi');
                const parts = text.split(pattern);
                
                return parts.map((part, index) => {
                const upperPart = part.toUpperCase();
                const entityEntry = Object.entries(senhas).find(([key, val]) => val === upperPart);

                        { id: 'ursla', nome: 'Santa Ursla', titulo: 'A Fera', antitese: 'Instinto vs Fúria', alin: 'CG', frase: 'O rugido que ecoa na mata.', historia: 'Menina criada por lobos, protetora da mata.', aparencia: 'Mulher selvagem com olhos de lobo.', padroeiro: 'Druidas, Patrulheiros', classes: ['Druida', 'Bárbaro'] }
                    ]
                    },
                    rei: {
                    id: 'behemoth', nome: 'BEHEMOTH', alin: 'CE', frase: 'A fúria primitiva que desfaz a ordem.', nomes: ['Cataclísmico', 'Último Instinto'], Icon: Skull, color: 'from-red-600 to-black',
                    historia: 'Instinto de sobrevivência corrompido em pura violência.',

                    personalidade: 'Furioso e barulhento.',

                        { id: 'irus', nome: 'Irus', pecado: 'Ira', alin: 'CE', frase: 'O sangue fervente.', desc: 'Guerreiro com armas fundidas aos braços em frenesi.', padroeiro: 'Mercenários, Berserkers', classes: ['Bruxo', 'Bárbaro'] },
                        { id: 'vorax', nome: 'Vorax', pecado: 'Gula', alin: 'CE', frase: 'O estômago do abismo.', desc: 'Esfera flutuante que é apenas uma boca voraz.', padroeiro: 'Canibais, Mineradores', classes: ['Bruxo', 'Feiticeiro'] }
                    ]
                    }
                }
                ]
            };

            const handleGlobalUnlock = () => {
                const rawInput = passwordInput.trim().toUpperCase();
                if (!rawInput) return;
                const tokens = rawInput.split(';').map(t => t.trim()).filter(t => t !== '');
                let revealedCount = 0;
                const newUnlocked = new Set(unlocked);
                tokens.forEach(token => {
                const entry = Object.entries(senhas).find(([id, pass]) => pass === token);
                if (entry) {
                    const [id] = entry;
                    if (!newUnlocked.has(id)) {
                    newUnlocked.add(id);
                    revealedCount++;
                    }
                }
                });
                if (revealedCount > 0) {
                setUnlocked(newUnlocked);
                setStatusMessage({ text: `${revealedCount} essências sintonizadas.`, type: 'success' });
                setPasswordInput('');
                } else {
                setStatusMessage({ text: 'Invocação falhou.', type: 'error' });
                }
                setTimeout(() => setStatusMessage({ text: '', type: '' }), 3000);
            };

            const handleMasterUnlock = () => {
                if (masterPassInput === MASTER_PASSWORD) {
                setIsMasterMode(true);
                setMasterPassInput('');
                setStatusMessage({ text: 'Visão do Mestre Ativada.', type: 'success' });
                } else {
                setStatusMessage({ text: 'Acesso negado.', type: 'error' });
                }
                setTimeout(() => setStatusMessage({ text: '', type: '' }), 3000);
            };

            const isUnlocked = (id) => isMasterMode || unlocked.has(id);
            
            const isPilarHeaderVisible = (pilar) => {
                if (isMasterMode) return true;
                const ids = [pilar.deus.id, pilar.rei.id, ...pilar.deus.santos.map(s=>s.id), ...pilar.rei.demonios.map(d=>d.id)];
                return ids.some(id => unlocked.has(id));
            };

            const renderLocked = (id, compact = false) => (
                <div key={`locked-${id}`} className={`flex flex-col items-center justify-center rounded-sm bg-stone-950/50 border-2 border-dashed border-stone-800 shadow-inner ${compact ? 'p-3 min-h-[80px]' : 'p-6 min-h-[120px]'}`}>
                <Lock className="text-stone-800" size={compact ? 18 : 28} />
                </div>
            );

            return (
                <div className="w-full min-h-screen bg-[#070606] text-stone-300 font-serif selection:bg-red-500/30 overflow-x-hidden relative">
                <div className="absolute inset-0 opacity-[0.03] pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]"></div>

                <div className="w-full max-w-7xl mx-auto px-4 py-4 sm:px-6 md:p-8 space-y-6 relative z-10">
                    
                    {/* Master Access */}
                    <div className="flex justify-end items-center">

                                            <p className="text-xs text-stone-500 font-serif leading-relaxed">{redactText(panteao.soberanos.nihilum.historia)}</p>
                                        </div>
                                        
                                        <div className="bg-black/50 p-4 rounded-xl border border-red-500/20">
                                            <div className="flex flex-row-reverse items-center gap-2 mb-2 text-red-500">
                                                <Crosshair size={14} />
                                                <h5 className="font-black uppercase text-[10px] tracking-widest">Motivação</h5>
                                            </div>
                                            <p className="text-xs text-stone-500 font-serif leading-relaxed">{redactText(panteao.soberanos.nihilum.motivacao)}</p>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-black/50 p-4 rounded-xl border border-red-500/20">
                                            <h5 className="font-black uppercase text-[10px] tracking-widest text-red-500 mb-2">Personalidade</h5>
                                            <p className="text-[10px] text-stone-600 font-serif leading-tight">{redactText(panteao.soberanos.nihilum.personalidade)}</p>
                                            </div>
                                            <div className="bg-black/50 p-4 rounded-xl border border-red-500/20">
                                            <h5 className="font-black uppercase text-[10px] tracking-widest text-red-500 mb-2">Aparência</h5>
                                            <p className="text-[10px] text-stone-600 font-serif leading-tight">{redactText(panteao.soberanos.nihilum.aparencia)}</p>
                                            </div>
                                        </div>
                                    </div>
                                    </div>
                                </div>
                                ) : <div className="p-10 border border-dashed border-stone-900 rounded-3xl text-center italic text-stone-600 text-sm h-full flex items-center justify-center">O destino do Nada reside além da compreensão mortal.</div>}
                            </div>
                            </div>
                        )}

                        {panteao.pilares.some(p => isUnlocked(p.deus.id) || p.deus.santos.some(s=>isUnlocked(s.id))) && (
                            <div className="space-y-16 pt-12 border-t border-stone-900 animate-in fade-in">
                            <h3 className="text-xl font-black text-amber-700 uppercase tracking-[0.3em] border-b border-amber-900/10 pb-2">II. Os Pilares da Criação</h3>
                            {panteao.pilares.map((p, idx) => {
                                const DeusIcon = p.deus.Icon;
                                return (
                                (isUnlocked(p.deus.id) || p.deus.santos.some(s=>isUnlocked(s.id))) && (
                                <div key={`comp-god-sec-${p.id}`} className="space-y-12 bg-gradient-to-br from-stone-900/40 to-stone-950 p-8 md:p-14 border border-stone-900 rounded-3xl animate-in fade-in shadow-xl relative overflow-hidden">
                                    <div className="absolute -left-20 -top-20 opacity-5 pointer-events-none">
                                        <DeusIcon size={300} />
                                    </div>

                                    <div className="border-b border-stone-800 pb-4 flex items-center gap-6 relative z-10">
                                        <div className="p-4 bg-amber-500/10 rounded-2xl border border-amber-500/20 text-amber-500 shadow-[0_0_30px_rgba(245,158,11,0.1)]">
                                        <DeusIcon size={40} />
                                        </div>
                                        <div>
                                        <h4 className="text-4xl md:text-6xl font-black text-stone-100 uppercase italic leading-none">{p.deus.nome}</h4>
                                        <p className="text-[10px] text-stone-500 tracking-widest uppercase mt-2 font-bold">Domínio da {p.dominio}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12 text-sm text-stone-400 font-serif relative z-10">
                                        {isUnlocked(p.deus.id) && (
                                        <div className="space-y-4 animate-in fade-in">
                                            <div className="space-y-4">
                                                <p className="leading-relaxed"><strong className="text-amber-600 uppercase text-xs tracking-wider">História:</strong> {redactText(p.deus.historia)}</p>
                                                <p className="leading-relaxed"><strong className="text-amber-600 uppercase text-xs tracking-wider">Motivação:</strong> {redactText(p.deus.motivacao)}</p>
                                                <p className="leading-relaxed"><strong className="text-amber-600 uppercase text-xs tracking-wider">Personalidade:</strong> {redactText(p.deus.personalidade)}</p>
                                                <p className="leading-relaxed"><strong className="text-amber-600 uppercase text-xs tracking-wider">Aparência:</strong> {redactText(p.deus.apVerdadeira)}</p>
                                                <p className="leading-relaxed"><strong className="text-amber-600 uppercase text-xs tracking-wider">Avatar:</strong> {redactText(p.deus.avatar)}</p>
                                            </div>
                                            <div className="bg-stone-950 p-4 border border-amber-900/10 text-xs rounded-xl mt-4">
                                                <p className="font-black text-amber-600 uppercase tracking-widest mb-1">Liturgia Sagrada</p>
                                                <p className="italic text-stone-500 font-serif">{p.deus.nomes?.join(' • ')}</p>
                                            </div>
                                        </div>
                                        )}
                                        <div className="space-y-6">
                                            <h5 className="font-black text-stone-600 uppercase tracking-widest text-xs border-b border-stone-800 pb-2">Arautos Divinos</h5>
                                            {p.deus.santos.map((s, sIdx) => isUnlocked(s.id) && (
                                            <div key={`comp-santo-bible-${s.id}`} className="p-4 rounded-xl bg-stone-900/40 border border-stone-800 relative group hover:border-amber-900/30 transition-colors">
                                                <div className="absolute top-4 right-4 text-amber-900/40"><User size={16}/></div>
                                                <p className="font-black text-amber-500 uppercase text-sm tracking-widest mb-1">{s.nome}</p>
                                                <p className="text-[10px] text-stone-500 uppercase tracking-widest mb-2 font-bold">{s.titulo}</p>
                                                <p className="text-xs text-stone-400 italic mb-2 leading-relaxed">"{redactText(s.frase)}"</p>
                                                <p className="text-xs text-stone-500 mb-3 leading-relaxed">{redactText(s.historia)}</p>
                                                <p className="text-xs text-stone-500 mb-3"><strong>Aparência:</strong> {redactText(s.aparencia)}</p>
                                                
                                                <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-stone-800/50">
                                                <div className="text-[9px] text-stone-600 uppercase font-black">
                                                    <span className="flex items-center gap-1 mb-1 text-amber-900/60"><Menu size={8}/> Padroado</span>
                                                    {s.padroeiro}
                                                </div>
                                                <div className="text-[9px] text-stone-600 uppercase font-black">
                                                    <span className="flex items-center gap-1 mb-1 text-amber-900/60"><PenTool size={8}/> D&D</span>
                                                    {s.classes?.join(', ')}
                                                </div>
                                                </div>
                                            </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                )
                            )})}
                            </div>
                        )}

                        {panteao.pilares.some(p => isUnlocked(p.rei.id) || p.rei.demonios.some(d=>isUnlocked(d.id))) && (
                            <div className="space-y-16 pt-12 border-t border-stone-900 animate-in fade-in">
                            <h3 className="text-xl font-black text-red-500 uppercase tracking-[0.3em] border-b border-red-500/10 pb-2">III. Os Agentes da Corrupção</h3>
                            {panteao.pilares.map((p, idx) => {
                                const ReiIcon = p.rei.Icon;
                                return (
                                (isUnlocked(p.rei.id) || p.rei.demonios.some(d=>isUnlocked(d.id))) && (
                                <div key={`comp-rei-sec-${p.id}`} className="space-y-12 bg-black p-8 md:p-14 border border-red-500/20 text-right animate-in fade-in rounded-3xl shadow-xl shadow-red-900/5 relative overflow-hidden">
                                    <div className="absolute -right-20 -top-20 opacity-5 pointer-events-none">
                                        <ReiIcon size={300} />
                                    </div>

                                    <div className="border-b border-red-500/20 pb-4 flex flex-row-reverse items-center gap-6 relative z-10">
                                        <div className="p-4 bg-red-950/10 rounded-2xl border border-red-500/20 text-red-500 shadow-[0_0_30px_rgba(220,38,38,0.1)]">
                                        <ReiIcon size={40} />
                                        </div>
                                        <div>
                                        <h4 className="text-3xl md:text-5xl font-black text-red-600 uppercase italic leading-none">{p.rei.nome}</h4>
                                        <p className="text-[9px] text-red-400 tracking-[0.4em] uppercase mt-2">Opositor de {p.deus.nome} • {p.rei.alin}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-16 text-sm text-stone-500 font-serif leading-relaxed relative z-10">
                                        <div className="space-y-12 md:order-2">
                                            <h5 className="font-black text-red-900 uppercase tracking-widest text-xs border-b border-red-900/30 pb-2">Encarnações Demoníacas</h5>
                                            {p.rei.demonios.map((d, dIdx) => isUnlocked(d.id) && (
                                            <div key={`comp-dem-bible-${d.id}`} className="p-4 rounded-xl bg-stone-950 border border-red-900/20 relative group hover:border-red-500/30 transition-colors text-right">
                                                <div className="absolute top-4 left-4 text-red-900/40"><Ghost size={16}/></div>
                                                <p className="font-black text-red-500 uppercase text-sm tracking-widest">{d.nome} <span className="text-[10px] italic ml-1 text-red-900">({d.pecado})</span></p>
                                                <p className="text-xs italic text-red-400/60 mb-2">"{redactText(d.frase)}"</p>
                                                <p className="text-xs text-stone-600 mb-3">"{redactText(d.desc)}"</p>
                                                
                                                <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-red-900/20">
                                                    <div className="text-[9px] text-red-900/80 uppercase font-black text-right">
                                                    <span className="block text-red-950 mb-1">D&D</span>
                                                    {d.classes?.join(', ')}
                                                    </div>
                                                    <div className="text-[9px] text-red-900/80 uppercase font-black text-right">
                                                    <span className="block text-red-950 mb-1">Patronato</span>
                                                    {d.padroeiro}
                                                    </div>
                                                </div>
                                            </div>
                                            ))}
                                        </div>
                                        {isUnlocked(p.rei.id) && (
                                        <div className="space-y-6 animate-in fade-in md:order-1 text-left">
                                            <div className="space-y-4">
                                                <p className="text-right"><strong className="text-red-500 uppercase text-xs tracking-wider">Gênese Abissal:</strong> {redactText(p.rei.historia)}</p>
                                                <p className="text-right"><strong className="text-red-500 uppercase text-xs tracking-wider">Infausto:</strong> {redactText(p.rei.motivacao)}</p>
                                                <p className="text-right"><strong className="text-red-500 uppercase text-xs tracking-wider">Natureza:</strong> {redactText(p.rei.personalidade)}</p>
                                                <p className="text-right"><strong className="text-red-500 uppercase text-xs tracking-wider">Manifestação:</strong> {redactText(p.rei.aparencia)}</p>
                                            </div>
                                            <div className="bg-stone-950 p-4 border border-red-500/20 text-xs text-right rounded-xl mt-4">
                                                <p className="font-black text-red-500 uppercase tracking-widest mb-1">Nomes Profanos</p>
                                                <p className="italic text-red-400/60 font-serif">{p.rei.nomes?.join(' • ')}</p>
                                            </div>
                                        </div>
                                        )}
                                    </div>
                                </div>
                                )
                            )})}
                            </div>
                        )}
                        </div>
                    )}
                    </main>

                    <footer className="pt-16 pb-12 text-center border-t border-stone-900/40 opacity-90 relative">
                    <div className="flex flex-col sm:flex-row justify-center items-center gap-6 sm:gap-16 mb-12">
                        {isUnlocked('totum') && (
                        <div className="flex items-center gap-3 px-8 py-2 border border-amber-900/10 bg-amber-950/5 shadow-2xl animate-in fade-in group">
                            <Shield className="text-amber-500 group-hover:scale-110 transition-transform" size={14} />
                            <span className="text-[10px] font-black uppercase tracking-[0.2em] text-stone-600 leading-none">A Ordem de Totum</span>
                        </div>
                        )}
                        {isUnlocked('nihilum') && (
                        <div className="flex items-center gap-3 px-8 py-2 border border-red-500/10 bg-black shadow-2xl animate-in fade-in group">
                            <Skull className="text-red-500 group-hover:scale-110 transition-transform" size={14} />
                            <span className="text-[10px] font-black uppercase tracking-[0.2em] text-red-500/60 leading-none">O Vazio de Nihilum</span>
                        </div>
                        )}
                    </div>
                    <p className="text-[9px] font-bold uppercase tracking-[0.8em] text-stone-800">Nexus Framework • O Compêndio</p>
                    </footer>
                </div>
                </div>
            );
            };

            const root = createRoot(document.getElementById('root'));
            root.render(<App />);
    </script>
</body>
</html>
