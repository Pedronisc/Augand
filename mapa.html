<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Augand - Sistema Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;700&family=Spectral:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --nexus-bg: #050505;
            --nexus-card: rgba(15, 15, 15, 0.95);
            --nexus-border: rgba(180, 83, 9, 0.25);
            --nexus-amber: #f59e0b;
            --nexus-gold-soft: #d97706;
            --nexus-text: #d6d3d1;
        }

        body {
            background-color: var(--nexus-bg);
            color: var(--nexus-text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            selection: background-color: rgba(180, 83, 9, 0.3);
        }

        .medieval-font { font-family: 'Cinzel', serif; }

        /* Fundo Texturizado */
        .nexus-overlay {
            position: fixed;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            z-index: 1;
        }

        .map-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            background: #000;
            overflow: hidden;
        }

        .map-container:active { cursor: grabbing; }

        #map-wrapper {
            position: absolute;
            transform-origin: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            width: 11520px; 
            height: 5670px;
            will-change: transform;
            backface-visibility: hidden;
        }

        #world-map {
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
            image-rendering: -webkit-optimize-contrast;
            object-fit: cover;
        }

        /* Sidebar Nexus */
        #sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 320px;
            z-index: 50;
            background: var(--nexus-card);
            border-left: 1px solid var(--nexus-border);
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        #sidebar.open { transform: translateX(0); }

        #sidebar-toggle {
            position: absolute;
            left: 0;
            transform: translateX(-100%);
            top: 24px;
            height: 44px;
            padding: 0 14px;
            min-width: 130px;
            background: var(--nexus-card);
            border: 1px solid var(--nexus-border);
            border-right: none;
            border-radius: 10px 0 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: var(--nexus-amber);
            box-shadow: -8px 0 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        #sidebar-toggle:hover {
            background-color: #111;
            border-color: rgba(245, 158, 11, 0.5);
        }

        #sidebar-toggle .toggle-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #sidebar-toggle span {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 1px;
        }

        /* Botões Flutuantes à Esquerda */
        .controls-left {
            position: fixed;
            left: 24px;
            bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 40;
        }

        .nexus-btn {
            width: 52px;
            height: 52px;
            background: var(--nexus-card);
            border: 1px solid var(--nexus-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--nexus-amber);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            position: relative;
        }

        .nexus-btn:hover {
            transform: scale(1.08);
            border-color: var(--nexus-amber);
            color: #fff;
        }

        .nexus-btn .label {
            position: absolute;
            left: 64px;
            background: var(--nexus-card);
            border: 1px solid var(--nexus-border);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            transform: translateX(-10px);
        }

        .nexus-btn:hover .label {
            opacity: 1;
            transform: translateX(0);
        }

        /* Modal Info */
        #info-card {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 650px;
            max-height: 80vh;
            z-index: 100;
            background: #0a0a0a;
            border: 1px solid var(--nexus-border);
            border-radius: 20px;
            box-shadow: 0 0 80px rgba(0,0,0,0.95);
            overflow-y: auto;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            z-index: 90;
        }

        /* Loading */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.5s ease;
        }

        .progress-wrapper {
            width: 280px;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid rgba(180, 83, 9, 0.15);
        }

        #progress-bar { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, #92400e, var(--nexus-amber), #92400e); 
            transition: width 0.4s ease; 
        }

        .summary-text { 
            line-height: 1.75; 
            font-size: 1.05rem; 
            text-align: justify; 
            color: #d1d5db;
        }

        .summary-text p { margin-bottom: 1.25rem; }
        
        .summary-text p:first-of-type::first-letter {
            font-size: 2.8rem;
            font-weight: 700;
            float: left;
            margin-right: 0.6rem;
            line-height: 1;
            color: var(--nexus-amber);
            font-family: 'Cinzel', serif;
        }

        .special-name-style { 
            text-decoration: underline; 
            font-weight: 700; 
            color: var(--nexus-amber);
        }

        .pulse-text { 
            animation: pulse 4s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

        .region-item {
            border-left: 2px solid transparent;
            transition: all 0.3s;
        }
        .region-item:hover {
            background: rgba(245, 158, 11, 0.04);
            border-left-color: var(--nexus-amber);
            padding-left: 1rem;
        }
    </style>
</head>
<body>

    <div class="nexus-overlay"></div>

    <div id="loader">
        <div class="text-amber-700/40 mb-5">
            <i data-lucide="gem" width="40" height="40"></i>
        </div>
        <p class="medieval-font tracking-[0.3em] text-[11px] uppercase text-amber-100/80">Sincronizando Nexus</p>
        <div class="progress-wrapper">
            <div id="progress-bar"></div>
        </div>
        <p id="progress-percent" class="text-[9px] text-stone-600 mt-3 uppercase tracking-[0.2em] font-bold">Iniciando Protocolo</p>
    </div>

    <div id="overlay" class="overlay" onclick="closeInfo()"></div>

    <!-- Header Nexus com Botão de Retorno -->
    <header class="fixed top-0 left-0 w-full p-8 pointer-events-none z-10 flex flex-col items-start gap-4">
        <!-- Botão Retornar ao Menu Principal -->
        <a href="index.html" class="pointer-events-auto flex items-center gap-3 bg-black/70 backdrop-blur-lg px-4 py-2 border border-amber-900/30 rounded-lg text-amber-600 hover:text-amber-400 hover:border-amber-600/50 transition-all shadow-xl group">
            <i data-lucide="arrow-left" width="16" height="16"></i>
            <span class="medieval-font text-[10px] font-bold uppercase tracking-widest">Menu Principal</span>
        </a>

        <!-- Bloco de Título Principal -->
        <div class="pointer-events-auto bg-black/70 backdrop-blur-lg p-5 border-l-2 border-amber-600/80 rounded-xl shadow-2xl inline-block cursor-pointer group" onclick="showInfo('augand')">
            <h1 class="medieval-font text-3xl font-bold text-amber-500 tracking-tight group-hover:text-amber-400 transition-colors uppercase">Augand</h1>
            <p class="text-[9px] text-stone-400 uppercase tracking-[0.4em] mt-1.5 font-bold pulse-text">Arquivo Central da Criação</p>
        </div>
    </header>

    <!-- Controles Flutuantes -->
    <div class="controls-left">
        <!-- Toggle Mapa Biomas/Político -->
        <button id="map-toggle-btn" class="nexus-btn" title="Alternar Visualização" onclick="toggleMapMode()">
            <i id="toggle-icon-map" data-lucide="layers" width="22" height="22"></i>
            <span id="toggle-label" class="label text-stone-300">Modo Biomas</span>
        </button>
        
        <!-- Recalibrar Foco -->
        <button id="recenter-btn" class="nexus-btn" title="Recalibrar Foco" onclick="recenterMap()">
            <i data-lucide="compass" width="22" height="22"></i>
            <span class="label text-stone-300">Recalibrar Foco</span>
        </button>
    </div>

    <aside id="sidebar" class="shadow-2xl">
        <div id="sidebar-toggle" onclick="toggleSidebar()">
            <div class="toggle-content">
                <i data-lucide="scroll" width="18" height="18"></i>
                <span>Resumo</span>
            </div>
            <i id="toggle-icon-sidebar" data-lucide="chevron-left" width="16" height="16"></i>
        </div>
        <div class="p-8 h-full overflow-y-auto flex flex-col">
            <div class="flex items-center gap-3 mb-8 border-b border-stone-800/50 pb-4">
                <i data-lucide="map" class="text-amber-700/60" width="18"></i>
                <h2 class="medieval-font font-bold text-base text-stone-300 uppercase tracking-widest">Geopolítica</h2>
            </div>
            <ul id="region-list" class="space-y-0.5 flex-1">
                <li class="p-3.5 mb-4 rounded-xl border border-amber-900/20 bg-amber-950/10 cursor-pointer transition-all text-amber-100/90 font-bold uppercase text-[10px] tracking-[0.15em] flex items-center gap-3 hover:bg-amber-900/20 hover:border-amber-700/40">
                    <a href="historia.html" class="flex items-center gap-3 w-full">
                        <i data-lucide="book-open" width="14" class="text-amber-600"></i> Crónicas do Mundo
                    </a>
                </li>
            </ul>
            <footer class="mt-8 pt-4 border-t border-stone-900 text-[8px] text-stone-700 uppercase tracking-widest font-bold">
                Nexus v2.6.0
            </footer>
        </div>
    </aside>

    <div class="map-container" id="map-viewport">
        <div id="map-wrapper">
            <img src="https://lh3.googleusercontent.com/u/0/d/1ONaVbRjswIXcjvwRyDXmt95W9EN6JhQA=w4096" 
                 id="world-map" 
                 alt="Nexus Map" 
                 draggable="false"
                 onload="startMap()">
        </div>
    </div>

    <div id="info-card" class="p-0">
        <div class="sticky top-0 bg-black/90 backdrop-blur-md p-7 border-b border-stone-900/50 flex justify-between items-center z-20">
            <div class="flex items-center gap-4">
                <div class="p-2.5 rounded-lg bg-amber-950/20 text-amber-500 border border-amber-900/10">
                    <i data-lucide="scroll" width="22" height="22"></i>
                </div>
                <h2 id="card-title" class="medieval-font text-2xl text-amber-50 font-bold uppercase tracking-tight">Título</h2>
            </div>
            <button class="text-stone-600 hover:text-amber-500 transition-colors" onclick="closeInfo()">
                <i data-lucide="x" width="28" height="28"></i>
            </button>
        </div>
        <div class="p-9">
            <div id="card-body" class="summary-text"></div>
        </div>
    </div>

    <script>
        const maps = {
            political: "https://lh3.googleusercontent.com/u/0/d/1ONaVbRjswIXcjvwRyDXmt95W9EN6JhQA=w4096",
            biome: "https://lh3.googleusercontent.com/u/0/d/1VxYugi7c7cPidVuuCQNq1sRHJMqD8DxG=w4096"
        };
        
        let currentMapMode = 'political';

        const specialNames = [
            "Totum", "Nihilum", "Deuses Primordiais", "Verion", "Umbra", "Vastus", "Aion", "Anima", "Santos",
            "São Valerius", "Santa Lyra", "Santa Límia", "São Argos", "Santa Arquídea", "São Kael", "São Dante",
            "Santa Moira", "São Benedict", "Santa Ursla", "Reis Demônios", "Lucifuge", "Nocturnus", "Abraxas",
            "Eon", "Behemoth", "Demônios Superiores", "Narcis", "Miraj", "Phobos", "Lethar", "Zelus", "Mammon",
            "Sopor", "Carnis", "Irus", "Vorax"
        ];

        const regionsData = {
            augand: { 
                title: "O Continente de Augand", 
                summary: "<p>Augand é uma terra de extremos geográficos e espirituais, estendendo-se das geleiras impiedosas da Coroa Gelada ao norte até a corrupção vulcânica das Terras Abissais ao sul. O continente é um palco de disputa silenciosa entre as forças da Criação e do Abismo, onde a influência dos Cinco Deuses Primordiais molda não apenas a fé, mas a própria arquitetura e cultura das nações.</p><p>Enquanto o norte luta contra o frio sob o olhar de Umbra e o oeste busca ordem e expansão sob a luz de Verion, o leste permanece indomado e vibrante com a energia de Anima. No entanto, é no sul que todos os olhos convergem com temor, onde a realidade se desgasta e apenas a vigilância constante impede que o mundo seja engolido pelo Nihilum.</p><p>A política de Augand é tão variada quanto seus biomas, operando em um equilíbrio tenso entre teocracias rígidas, repúblicas mercantis e monarquias antigas. O comércio flui através de artérias vitais como o Rio Solares e o Golfo da Espreita, conectando povos que, embora divergentes em costumes, compartilham a necessidade de sobrevivência. Da diplomacia culinária de Lulzor à disciplina militar de Grimron, cada estado desenvolveu uma resposta única aos perigos do mundo, criando uma teia complexa de alianças e rivalidades que gira em torno da grande metrópole central: Rezdan, onde o ouro muitas vezes fala mais alto que os deuses.</p>" 
            },
            bral: { title: "Reino de Bral", summary: "<p>O coração pulsante da economia continental, Bral é uma monarquia constitucional onde o verdadeiro poder reside nas guildas e no ouro. Dominando as planícies férteis centrais e o comércio marítimo através da Baía da Fortuna, sua capital, Rezdan, é a cidade mais cosmopolita do mundo, um lugar onde a tradição é constantemente desafiada pela inovação e pelo lucro, sob a bênção pragática de Vastus e Aion.</p>" },
            orderan: { title: "Estado Sagrado de Orderan", summary: "<p>Uma teocracia austera e monumental dedicada a Verion, onde a lei e a verdade são absolutas e o silêncio é uma forma de oração. Protegida pela Cordilheira Central, Orderan é uma nação de cidades brancas e disciplina férrea, que vê a magia arcana não sancionada como uma heresia perigosa e mantém uma vigilância constante sobre a moralidade de seus cidadãos e vizinhos.</p>" },
            rosefair: { title: "Comunidade de Rosefair", summary: "<p>Um refúgio enevoado para artistas, bardos e livres-pensadores, Rosefair é uma confederação de cidades-estado que valoriza a expressão individual acima da ordem rígida. Sob a influência de Aion, a nação opera em um ritmo próprio, onde a realidade parece mais fluida e a defesa é garantida mais por oráculos e labirintos mágicos do que por muralhas de pedra.</p>" },
            grimron: { title: "Principado Grimron", summary: "<p>Uma nação militarizada forjada na rocha vulcânica das montanhas centrais, cujos habitantes são conhecidos por seu estoicismo e disciplina inquebrável. Servindo como vigias sob o manto de Umbra, as cidades de Grimron são fortalezas inexpugnáveis, e seu povo vive em prontidão constante, considerando-se a muralha viva que protege o oeste civilizado dos perigos selvagens.</p>" },
            gabila: { title: "Ducado Gabila", summary: "<p>Atuando como o escudo dos vales centrais, Gabila é uma extensão defensiva da cultura de Grimron, focada obsessivamente em fortificações e táticas de cerco. Sua capital litorânea, Galwed, é uma maravilha da engenharia militar que bloqueia o acesso naval ao interior, refletindo uma sociedade ansiosa, porém leal, que dedica sua existência à manutenção de suas devesas impenetráveis.</p>" },
            dustcrosia: { title: "Império Dustcrosia", summary: "<p>Antigo e orgulhoso, Dustcrosia é um império expansionista no oeste que busca restaurar sua glória passada através de uma hierarquia social rígida e monumentalismo arquitetônico. Guiados por uma interpretação severa de Verion, seus cidadãos acreditam no seu direito divino de governar e civilizar o continente, apoiados por uma marinha poderosa e uma academia jurídica que transforma leis em armas.</p>" },
            sildia: { title: "República de Sildia", summary: "<p>Isolada pelo gelo do norte, Sildia é uma tecnocracia de sobreviventes que dominou a engenharia geotérmica para prosperar onde outros pereceriam. Devotos de Vastus, os sildianos valorizam a eficiência e a cooperação comunitária acima de tudo, vivendo em cidades aquecidas por vapor e conectadas por pontes audaciosas que desafiam o inverno eterno.</p>" },
            lulzor: { title: "Ducado Lulzor", summary: "<p>Conhecido como o jardim de Augand, Lulzor é uma terra pacífica e fértil que transformou a agricultura e a culinária em suas maiores ferramentas políticas. Sob a proteção de Anima, o ducado treina mercadores-diplomatas em sua famosa academia, usando a exportação de vinhos finos e alimentos essenciais para garantir sua segurança e influência sem a necessidade de exércitos permanentes.</p>" },
            shund: { title: "Reino de Shund", summary: "<p>Uma nação onde a civilização se curva à natureza, Shund é coberta por florestas densas onde as cidades são cultivadas nas árvores em vez de construídas com pedras. Governado por uma monarquia tradicionalista aliada a círculos druídicos de Anima, o povo vive em simbiose respeitosa com as bestas da mata, mant-se isolado e misterioso para os forasteiros.</p>" },
            dashia: { title: "Dashia", summary: "<p>Uma magocracia situada nas vastas terras do leste, Dashia é o centro do conhecimento arcano e da pesquisa histórica, governada por um conselho de sábios. Dedicada a Aion, a nação é pontilhada por torres flutuantes e ruínas de eras passadas, onde o poder mágico define o status social e a busca pelo entendimento da realidade muitas vezes flerta com o perigo.</p>" },
            mandunian: { title: "Tribos Mandunian", summary: "<p>Nômades das estepes do nordeste, os Mandunian rejeitam a vida sedentária em favor da liberdade e da honra tribal, movendo-se com seus rebanhos e yurts. Venerando os aspectos primordiais de Anima, são guerreiros a cavalo temidos e respeitados, cuja cultura oral e xamânica preserva tradições antigas em um local de reunião sagrado permanente, Ikhkhirga.</p>" },
            todel: { title: "Emirados Todel", summary: "<p>Uma federação rica e resiliente que domina as savanas e florestas sazonais do sudeste, prosperando através do comércio de especiarias e da adaptação a um clima de contrastes. Com uma cultura que mescla o luxo dos oásis com a dureza do dever militar, os Emirados dedicam sua riqueza à manutenção do Firman de Ferro, servindo como a primeira linha de defesa contra as abominações do sul.</p>" },
            ayanovia: { title: "República de Ayanovia", summary: "<p>Isolada na península sudeste, Ayanovia é uma nação elitista dedicada à busca obsessiva pela beleza estética e perfeição artística. Enquanto sua capital brilha com arquitetura de madrepérola e poesia, a cidade portuária de Malan serve como um contraponto anárquico, abrigando piratas e navegadores que enfrentam o perigoso Oceano dos Lamentos, longe das leis rígidas de pureza da república.</p>" },
            abissais: { title: "Terras Abissais", summary: "<p>No extremo sul, a civilização termina na colossal muralha do Firman de Ferro, uma fortificação eterna guarnecida por soldados de todo o continente para conter o mal. Além dela jazem as Terras Abissais, uma península corrompida e tempestuosa onde a realidade se desfaz sob a influência dos Reis Demônios, servindo como um lembrete constante da ameaça de Nihilum que aguarda qualquer falha na vigilância dos mortais.</p>" },
            geleiras: { title: "Geleiras do Norte", summary: "<p>Território de gelo perpétuo acima da Cordilheira da Aurora. Lendas locais dizem que gigantes brancos guardam tesouros congelados desde a Primeira Era. É o limite setentrional do mundo conhecido, onde o vento carrega o hálito de Umbra.</p>" }
        };

        const wrapper = document.getElementById('map-wrapper');
        const viewport = document.getElementById('map-viewport');
        const sidebar = document.getElementById('sidebar');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        
        let isDragging = false, startX, startY, currentX = 0, currentY = 0, scale = 1, initialScale = 1;

        function formatSpecialText(text) {
            let processed = text;
            const sortedNames = [...specialNames].sort((a, b) => b.length - a.length);
            sortedNames.forEach(name => {
                const regex = new RegExp(`(?<![\\wÀ-ÿ])(${name})(?![\\wÀ-ÿ])`, 'gi');
                processed = processed.replace(regex, '<span class="special-name-style">$1</span>');
            });
            return processed;
        }

        let progress = 0;
        const progressInterval = setInterval(() => {
            if (progress < 95) {
                progress += Math.random() * 5;
                if(progress > 95) progress = 95;
                updateProgressUI();
            }
        }, 150);

        function updateProgressUI() {
            progressBar.style.width = `${progress}%`;
            progressPercent.innerText = `${Math.floor(progress)}% Sincronizado`;
        }

        function startMap() {
            clearInterval(progressInterval);
            progress = 100;
            updateProgressUI();
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                wrapper.style.opacity = '1';
                calculateInitialScale();
                scale = initialScale;
                currentX = 0; currentY = 0;
                update();
                lucide.createIcons();
            }, 600);
        }

        function calculateInitialScale() {
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            initialScale = Math.min(winW / 11520, winH / 5670);
        }

        function recenterMap() { calculateInitialScale(); scale = initialScale; currentX = 0; currentY = 0; update(); }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            const icon = document.getElementById('toggle-icon-sidebar');
            const isOpen = sidebar.classList.contains('open');
            icon.setAttribute('data-lucide', isOpen ? 'chevron-right' : 'chevron-left');
            lucide.createIcons();
        }

        function toggleMapMode() {
            const img = document.getElementById('world-map');
            const icon = document.getElementById('toggle-icon-map');
            const label = document.getElementById('toggle-label');
            
            if (currentMapMode === 'political') {
                currentMapMode = 'biome';
                img.src = maps.biome;
                icon.setAttribute('data-lucide', 'image');
                label.innerText = "Modo Político";
            } else {
                currentMapMode = 'political';
                img.src = maps.political;
                icon.setAttribute('data-lucide', 'layers');
                label.innerText = "Modo Biomas";
            }
            lucide.createIcons();
        }

        function update() { 
            if (scale < initialScale) scale = initialScale;
            const mapW = 11520 * scale;
            const mapH = 5670 * scale;
            const viewW = viewport.clientWidth;
            const viewH = viewport.clientHeight;
            const limitX = Math.max(0, (mapW - viewW) / 2);
            const limitY = Math.max(0, (mapH - viewH) / 2);
            currentX = Math.min(Math.max(currentX, -limitX), limitX);
            currentY = Math.min(Math.max(currentY, -limitY), limitY);
            wrapper.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`; 
        }

        viewport.onmousedown = e => { 
            isDragging = true; startX = e.clientX - currentX; startY = e.clientY - currentY; 
            viewport.style.cursor = 'grabbing'; wrapper.style.transition = "opacity 0.8s ease"; 
        };
        window.onmouseup = () => { isDragging = false; viewport.style.cursor = 'grab'; };
        window.onmousemove = e => { if (!isDragging) return; currentX = e.clientX - startX; currentY = e.clientY - startY; update(); };
        
        viewport.onwheel = e => { 
            e.preventDefault(); 
            wrapper.style.transition = "opacity 0.8s ease";
            const zoomSpeed = 0.15;
            const prevScale = scale;
            const delta = e.deltaY > 0 ? -zoomSpeed : zoomSpeed;
            const nextScale = Math.max(initialScale, Math.min(initialScale * 25, scale + delta)); 
            if (nextScale !== prevScale) {
                const rect = viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top - rect.height / 2;
                const ratio = nextScale / prevScale;
                currentX = mouseX - (mouseX - currentX) * ratio;
                currentY = mouseY - (mouseY - currentY) * ratio;
                scale = nextScale;
                update();
            }
        };

        function showInfo(id) {
            const data = regionsData[id];
            if (!data) return;
            document.getElementById('card-title').innerText = data.title;
            document.getElementById('card-body').innerHTML = formatSpecialText(data.summary);
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('info-card').style.display = 'block';
            document.getElementById('info-card').scrollTop = 0;
            lucide.createIcons();
        }

        function closeInfo() { document.getElementById('info-card').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }

        const list = document.getElementById('region-list');
        const sortedKeys = Object.keys(regionsData).filter(k => k !== 'augand').sort((a, b) => 
            regionsData[a].title.localeCompare(regionsData[b].title)
        );

        sortedKeys.forEach(id => {
            const li = document.createElement('li');
            li.className = "region-item p-3 rounded-xl cursor-pointer text-stone-500 font-bold uppercase text-[10px] tracking-widest hover:text-amber-400";
            li.innerHTML = `${regionsData[id].title}`;
            li.onclick = () => { showInfo(id); if(window.innerWidth < 1024) toggleSidebar(); };
            list.appendChild(li);
        });

        window.onresize = () => { calculateInitialScale(); if (scale < initialScale) scale = initialScale; update(); };
        lucide.createIcons();
    </script>
</body>
</html>
